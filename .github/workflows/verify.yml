name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: pda-management/pom.xml
      - run: mvn -B -f pda-management/pom.xml verify
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: python tools/check_android_structure.py
      - run: chmod +x pda-android/gradlew
      - run: cd pda-android && ./gradlew assembleDebug testDebugUnitTest lintDebug
