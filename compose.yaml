services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./pda-management
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/retail
      DATABASE_USER: retail
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      SPRING_FLYWAY_LOCATIONS: ${SPRING_FLYWAY_LOCATIONS:-classpath:db/migration}
      FINDER_TIMEOUT_SECONDS: ${FINDER_TIMEOUT_SECONDS:-60}
      APP_BOOTSTRAP_ENABLED: ${APP_BOOTSTRAP_ENABLED:-false}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
