plugins { 
    id 'com.android.application'
}
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }

def finderTransport = project.hasProperty('finderTransport') ? project.property('finderTransport') : 'fcm'
if (!(finderTransport in ['fcm', 'polling'])) {
    throw new GradleException('finderTransport must be fcm or polling')
}

android {
    namespace 'com.company.pda'
    compileSdk 32
    defaultConfig {
        applicationId 'com.company.pda'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'FINDER_TRANSPORT', '"' + finderTransport + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'API_URL', '"' + (project.findProperty('apiUrl') ?: 'http://10.0.2.2:8080/') + '"'
    }
    buildFeatures { viewBinding true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    buildTypes {
        debug {
            buildConfigField 'String', 'API_URL', '"' + (project.findProperty('apiUrl') ?: 'http://10.0.2.2:8080/') + '"'
        }
        release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}
dependencies {
    // These versions support compileSdk 32; the UI uses Java/XML with view binding.
    def activityVersion = '1.5.1'
    def lifecycleVersion = '2.5.1'
    implementation project(':scanner-factory')
    implementation project(':device-factory')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.5.1'
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycleVersion"
    implementation 'com.google.android.material:material:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation "androidx.activity:activity:$activityVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycleVersion"
    implementation 'androidx.room:room-runtime:2.4.3'
    annotationProcessor 'androidx.room:room-compiler:2.4.3'
    implementation 'androidx.work:work-runtime:2.7.1'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation platform('com.google.firebase:firebase-bom:30.5.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
}
