plugins { id 'com.android.library' }
android {
 namespace 'com.company.scanner.factory'
 compileSdk 35
 defaultConfig { minSdk 26 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
}
dependencies {
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.mockito:mockito-core:5.14.2'
 api project(':scanner-api')
 implementation project(':scanner-zebra')
 implementation project(':scanner-urovo')
 implementation project(':scanner-generic')
}
